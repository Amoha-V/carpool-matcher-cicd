name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time
concurrency:
  group: carpool-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile, run tests and package
        run: mvn -B clean package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  docker:
    name: Build and push Docker image
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carpool-matcher:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/carpool-matcher:latest

  deploy:
    name: Deploy to AKS (Ansible)
    needs: docker
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/carpool-matcher:${{ needs.docker.outputs.tag }}
      BUILD_TAG: ${{ needs.docker.outputs.tag }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure kubectl for the AKS cluster
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get nodes

      - name: Install Ansible
        run: |
          python3 -m venv "$HOME/ansible-venv"
          "$HOME/ansible-venv/bin/pip" install --quiet ansible-core

      - name: Deploy with Ansible and run smoke test
        run: |
          "$HOME/ansible-venv/bin/ansible-playbook" \
            -i ansible/inventory.ini ansible/deploy.yml \
            -e "image=$IMAGE" -e "build_tag=$BUILD_TAG"

      - name: Show deployment status
        if: always()
        run: |
          kubectl -n carpool get deployment,statefulset,pods,pvc,svc -o wide
          kubectl -n carpool rollout history deployment/carpool-matcher
