spring.application.name=carpool-matcher
server.port=8080

# Shown in the UI header. Change this text to demonstrate an automatic redeployment.
app.message=Campus Carpool Matcher
app.version=@project.version@
# Injected by the pipeline / Kubernetes so the page shows exactly what is running
app.build=${BUILD_SHA:local}
app.environment=${APP_ENV:local}

# In-memory H2 database (data resets whenever the pod restarts)
spring.datasource.url=jdbc:h2:mem:carpooldb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Return readable error messages to the UI
server.error.include-message=always

# Health endpoints used by Kubernetes liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Finish in-flight requests before a pod stops (zero-downtime rolling updates)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
